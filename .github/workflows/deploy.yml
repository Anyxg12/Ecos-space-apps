# Publica la demo estática en GitHub Pages en cada push a main.
# Activar en el repositorio: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Backend opcional: si existen estos secretos/variables del repositorio, la demo se conecta a Supabase.
      # Si no existen, la compilación funciona igual y la app usa el modo local (como la versión 1.0).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://ztrrxxuvspvlssfpeyjv.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0cnJ4eHV2c3B2bHNzZnBleWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3MzQwNjIsImV4cCI6MjExMDMxMDA2Mn0.fOZVV2gpr1BruWLfYAqzCCGQfMvEPjDLtlRs7-jyFr0' }}
      # Entregables públicos (se abren directo en el navegador, sin iniciar sesión): PDFs y video demo.
      - run: |
          mkdir -p dist/entregables dist/video
          cp docs/entregables/*.pdf dist/entregables/
          cp docs/media/ecos-demo.mp4 dist/video/ecos-demo.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
